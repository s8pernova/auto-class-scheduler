name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Mostly a smoke test. Update later with real values.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci_dummy

      OPENAI_API_KEY: ci_dummy
      GOOGLE_API_KEY: ci_dummy
      GOOGLE_SEARCH_ENGINE_ID: ci_dummy

      DEFAULT_USER_ID: 00000000-0000-0000-0000-000000000000

      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci_dummy
      VITE_API_BASE_URL: /api/v1
      VITE_PUBLIC_POSTHOG_KEY: ""
      VITE_PUBLIC_POSTHOG_HOST: ""
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f infra/docker-compose.yml config -q

      - name: Build images (sanity check)
        run: docker compose -f infra/docker-compose.yml build
