services:
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scheduler_network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - scheduler_network
    environment:
      REDIS_URL: "${COMPOSE_REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.8.0-alpine3.23
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - scheduler_network
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

networks:
  scheduler_network:
    driver: bridge
