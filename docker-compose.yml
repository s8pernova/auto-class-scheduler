services:
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scheduler_network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - scheduler_network

networks:
  scheduler_network:
    driver: bridge
